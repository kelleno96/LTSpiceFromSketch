[project]
name = "sketch2spice"
version = "0.1.0"
description = "Turn a photo of a hand-drawn circuit sketch into an LTSpice simulation."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "openai>=1.40",
    "anthropic>=0.40",
    "spicelib>=1.3",
    "matplotlib>=3.8",
    "schemdraw>=0.19",
    "streamlit>=1.36",
    "numpy>=1.26",
    "plotly>=5.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sketch2spice"]
